<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>NWE 回測 20x SL5%</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#e2e8f0;font-family:monospace;padding:16px}
h1{font-size:18px;color:#38bdf8;margin-bottom:12px}
.params{background:#1e293b;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;color:#94a3b8}
.params span{color:#f8fafc;font-weight:bold}
#progress{background:#1e293b;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
#bar-wrap{background:#0f172a;border-radius:4px;height:8px;margin-top:6px}
#bar{background:#38bdf8;height:8px;border-radius:4px;width:0%;transition:width 0.2s}
#status{color:#94a3b8;margin-top:4px;font-size:12px}
.tf-section{margin-bottom:20px}
.tf-title{font-size:14px;color:#fbbf24;margin-bottom:8px;padding:4px 8px;background:#1e293b;border-radius:4px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#1e293b;color:#94a3b8;padding:6px 8px;text-align:right;font-weight:normal;position:sticky;top:0}
th:first-child,th:nth-child(2){text-align:left}
tr:hover{background:#1e293b}
td{padding:5px 8px;border-bottom:1px solid #1e293b;text-align:right}
td:first-child,td:nth-child(2){text-align:left}
.win-high{color:#4ade80}
.win-mid{color:#fbbf24}
.win-low{color:#f87171}
.pnl-pos{color:#4ade80}
.pnl-neg{color:#f87171}
.bl{color:#f87171}
.trophy{color:#fbbf24}
.warn{color:#f87171}
#start-btn{background:#0ea5e9;color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:14px;cursor:pointer;font-family:monospace}
#start-btn:hover{background:#38bdf8}
#start-btn:disabled{background:#334155;color:#64748b;cursor:not-allowed}
#result{margin-top:16px}
.summary{background:#1e293b;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;display:flex;gap:24px;flex-wrap:wrap}
.summary-item{display:flex;flex-direction:column;gap:2px}
.summary-item .label{color:#64748b;font-size:11px}
.summary-item .val{color:#f8fafc;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<h1>📊 NWE 回測｜20x 槓桿 SL 5%</h1>
<div class="params">
  參數：槓桿 <span>20x</span>　止損 <span>5%</span>　NWE H=<span>8</span> Mult=<span>3</span>　每幣拉 <span>500</span> 根K線　訊號：close 觸 band
</div>
<button id="start-btn" onclick="startBacktest()">▶ 開始回測</button>
<div id="progress" style="display:none">
  <div id="status">準備中...</div>
  <div id="bar-wrap"><div id="bar"></div></div>
</div>
<div id="result"></div>

<script>
const LEVERAGE = 20;
const SL_PCT = 0.05;
const NWE_H = 8;
const NWE_MULT = 3.0;
const MIN_TRADES = 1;
const BLACKLIST = new Set(['RVN','OP','ZRO','DOT','LINK','FET','MATIC']);

const SYMBOLS = [
  'BTC','ETH','BNB','SOL','XRP','ADA','AVAX','DOGE','TRX',
  'UNI','LTC','BCH','ATOM','FIL','APT','ARB','INJ','SUI','SEI',
  'TIA','WIF','PEPE','FLOKI','BONK','ORDI','NEIRO','GOAT','PNUT',
  'ACT','TURBO','MEW','POPCAT','BRETT','EIGEN','RENDER','ETHFI',
  'STRK','MANTA','JTO','BEAM','BLUR','MAGIC','ANKR','CHZ','SAND',
  'MANA','AXS','GMT','ROSE','NEAR','FTM','HBAR','VET','THETA',
  'IOTA','EGLD','KSM','KAVA','GRT','AAVE','COMP','MKR','SNX',
  'YFI','SUSHI','RUNE','HYPE','OP','DOT','LINK','FET','RVN','ZRO',
];

const TIMEFRAMES = [
  {name:'15m', interval:'15m'},
  {name:'30m', interval:'30m'},
  {name:'1h',  interval:'1h'},
  {name:'4h',  interval:'4h'},
];

function gaussianKernel(x, h) {
  return Math.exp(-0.5 * (x/h) * (x/h));
}

// Symmetric NWE（和 TradingView 一致）
// 每個點用「它附近的所有資料點」做 gaussian 加權平均
// 這樣 band 比 causal NWE 更窄，能產生有意義的訊號
function calcNWE(closes, h=8, mult=3.0) {
  const n = closes.length;
  const mid=[], upper=[], lower=[];
  for(let i=0; i<n; i++){
    let wSum=0, ySum=0;
    for(let j=0; j<n; j++){
      const w = gaussianKernel(i - j, h);
      wSum += w;
      ySum += w * closes[j];
    }
    const est = ySum / wSum;
    let varSum = 0;
    for(let j=0; j<n; j++){
      const w = gaussianKernel(i - j, h);
      varSum += w * (closes[j] - est) * (closes[j] - est);
    }
    const std = Math.sqrt(varSum / wSum);
    mid.push(est);
    upper.push(est + mult * std);
    lower.push(est - mult * std);
  }
  return {mid, upper, lower};
}

async function fetchKlines(sym, interval, limit=500) {
  const fapiBase = `https://fapi.binance.com/fapi/v1/klines?symbol=${sym}USDT&interval=${interval}&limit=${limit}`;
  const spotBase = `https://api.binance.com/api/v3/klines?symbol=${sym}USDT&interval=${interval}&limit=${limit}`;
  const proxy = url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

  const urls = [
    fapiBase,
    proxy(fapiBase),
    spotBase,
    proxy(spotBase),
  ];

  for(const url of urls){
    try{
      const r = await fetch(url, {signal: AbortSignal.timeout(12000)});
      if(!r.ok) continue;
      const data = await r.json();
      if(!Array.isArray(data) || data.length<10) continue;
      return {
        opens:  data.map(x=>parseFloat(x[1])),
        highs:  data.map(x=>parseFloat(x[2])),
        lows:   data.map(x=>parseFloat(x[3])),
        closes: data.map(x=>parseFloat(x[4])),
        times:  data.map(x=>x[0]),
      };
    }catch(e){}
  }
  return null;
}

function backtestOne(sym, tfName, klines) {
  const {opens, highs, lows, closes} = klines;
  const n = closes.length;
  if(n < 50) return null;

  const {mid, upper, lower} = calcNWE(closes, NWE_H, NWE_MULT);

  const trades = [];

  // 訊號：close 觸碰 band（close <= lower 或 close >= upper）
  // 下一根開盤進場
  for(let i=1; i<n-1; i++){
    const c = closes[i];
    const prevC = closes[i-1];
    let dir = null;

    // 多單：前根 close > lower，當根 close <= lower（觸下軌）
    if(prevC > lower[i-1] && c <= lower[i]) dir = 'long';
    // 空單：前根 close < upper，當根 close >= upper（觸上軌）
    else if(prevC < upper[i-1] && c >= upper[i]) dir = 'short';

    if(!dir) continue;

    const entry = opens[i+1];
    if(!entry || entry <= 0) continue;

    const slPrice = dir==='long' ? entry*(1-SL_PCT) : entry*(1+SL_PCT);
    let result = null;

    // 往後 60 根找出場
    for(let k=i+1; k<Math.min(i+61, n); k++){
      const h2 = highs[k], l2 = lows[k];
      if(dir === 'long'){
        if(l2 <= slPrice){ result = -SL_PCT * LEVERAGE; break; }
        if(h2 >= upper[k]){ result = (upper[k] - entry) / entry * LEVERAGE; break; }
      } else {
        if(h2 >= slPrice){ result = -SL_PCT * LEVERAGE; break; }
        if(l2 <= lower[k]){ result = (entry - lower[k]) / entry * LEVERAGE; break; }
      }
    }

    if(result !== null){
      trades.push({dir, entry, pnl: result, win: result > 0});
    }
    i++; // 跳過進場K線，避免重疊
  }

  if(trades.length < MIN_TRADES) return null;

  const wins = trades.filter(t=>t.win).length;
  const total = trades.length;
  const winRate = wins / total * 100;
  const totalPnl = trades.reduce((s,t)=>s+t.pnl, 0);
  const winTrades = trades.filter(t=>t.win);
  const avgTpPct = winTrades.length > 0
    ? winTrades.reduce((s,t)=>s + t.pnl/LEVERAGE*100, 0) / winTrades.length
    : 0;

  return {sym, tf:tfName, trades:total, wins, winRate, totalPnl, avgTpPct, blacklisted:BLACKLIST.has(sym)};
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function startBacktest(){
  document.getElementById('start-btn').disabled = true;
  document.getElementById('progress').style.display = 'block';
  document.getElementById('result').innerHTML = '';

  const total = SYMBOLS.length * TIMEFRAMES.length;
  let done = 0;
  const allResults = [];
  let fetchOk = 0, fetchFail = 0;

  for(const tf of TIMEFRAMES){
    for(const sym of SYMBOLS){
      done++;
      document.getElementById('status').textContent =
        `掃描中 ${done}/${total}：${sym} ${tf.name}`;
      document.getElementById('bar').style.width =
        (done/total*100).toFixed(1)+'%';

      try{
        const klines = await fetchKlines(sym, tf.interval, 500);
        if(klines){
          fetchOk++;
          const r = backtestOne(sym, tf.name, klines);
          if(r) allResults.push(r);
        } else {
          fetchFail++;
        }
      }catch(e){
        fetchFail++;
      }

      if(done % 5 === 0) await sleep(50);
    }
  }

  renderResult(allResults, fetchOk, fetchFail);
  document.getElementById('start-btn').disabled = false;
  document.getElementById('status').textContent =
    `✅ 完成！成功拉取 ${fetchOk} 個，失敗 ${fetchFail} 個`;
}

function renderResult(results, fetchOk, fetchFail){
  if(results.length === 0){
    document.getElementById('result').innerHTML =
      `<div style="color:#f87171;padding:16px">沒有找到有效結果（fetchOk=${fetchOk}, fetchFail=${fetchFail}）</div>`;
    return;
  }

  // 按勝率排序
  results.sort((a,b)=> b.winRate - a.winRate || b.trades - a.trades);

  const tfGroups = {};
  for(const tf of TIMEFRAMES) tfGroups[tf.name] = [];
  for(const r of results){
    if(tfGroups[r.tf]) tfGroups[r.tf].push(r);
  }

  const totalTrades = results.reduce((s,r)=>s+r.trades,0);
  const totalWins   = results.reduce((s,r)=>s+r.wins,0);
  const avgWR       = results.length > 0 ? results.reduce((s,r)=>s+r.winRate,0)/results.length : 0;

  let html = `
  <div class="summary">
    <div class="summary-item"><div class="label">有效組合</div><div class="val">${results.length}</div></div>
    <div class="summary-item"><div class="label">總交易次數</div><div class="val">${totalTrades}</div></div>
    <div class="summary-item"><div class="label">平均勝率</div><div class="val">${avgWR.toFixed(1)}%</div></div>
    <div class="summary-item"><div class="label">資料拉取</div><div class="val">${fetchOk}✓ ${fetchFail}✗</div></div>
  </div>`;

  for(const tf of TIMEFRAMES){
    const rows = tfGroups[tf.name];
    if(rows.length === 0) continue;
    const tfAvgWR = rows.reduce((s,r)=>s+r.winRate,0)/rows.length;

    html += `<div class="tf-section">
    <div class="tf-title">⏱ ${tf.name}　平均勝率 ${tfAvgWR.toFixed(1)}%　共 ${rows.length} 組</div>
    <table>
    <thead><tr>
      <th>幣種</th><th>標記</th>
      <th>勝率</th><th>次數</th><th>贏</th>
      <th>平均TP%</th><th>總損益(x)</th>
    </tr></thead><tbody>`;

    for(const r of rows){
      const wrCls = r.winRate>=60?'win-high':r.winRate>=45?'win-mid':'win-low';
      const pnlCls = r.totalPnl>=0?'pnl-pos':'pnl-neg';
      let mark = '';
      if(r.blacklisted) mark += '🚫';
      if(r.avgTpPct < 1.0) mark += '🏆';
      else if(r.avgTpPct >= 2.0) mark += '⚠️';

      const symCls = r.blacklisted ? ' class="bl"' : '';
      html += `<tr>
        <td${symCls}>${r.sym}</td>
        <td>${mark}</td>
        <td class="${wrCls}">${r.winRate.toFixed(1)}%</td>
        <td>${r.trades}</td>
        <td>${r.wins}</td>
        <td>${r.avgTpPct.toFixed(2)}%</td>
        <td class="${pnlCls}">${r.totalPnl>=0?'+':''}${r.totalPnl.toFixed(2)}x</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
  }

  document.getElementById('result').innerHTML = html;
}
</script>
</body>
</html>
